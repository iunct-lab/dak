# Amazon Bedrock: the agent's environment (scripts/compose_files.sh adds this file).

services:
  agent:
    environment:
      # Amazon Bedrock (optional; MODEL_NAME=bedrock/...) — see docs/getting-started/bedrock.md
      # Bare pass-through (no "=${VAR:-}") so unset vars stay unset in the
      # container: litellm treats an empty-string region as "configured" and
      # then rejects it instead of falling back to AWS_REGION/AWS_DEFAULT_REGION.
      - AWS_REGION_NAME
      - AWS_REGION
      - AWS_DEFAULT_REGION
      - AWS_BEARER_TOKEN_BEDROCK
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN

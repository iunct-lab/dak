# Web search (skills/web_search). On only when TAVILY_API_KEY is set; the key
# goes in the Authorization header, never here or in the URL.
# docs/getting-started/web-search.md
name: "tavily"
url: "https://mcp.tavily.com/mcp/"
type: "http"
url_env: "TAVILY_MCP_URL"
bearer_token_env: "TAVILY_API_KEY"
requires_env: ["TAVILY_API_KEY"]

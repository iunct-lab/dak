# Passes the key through SSM: the Docker config holds only the parameter name (replace `/example/anthropic-api-key` with your own).
# The agent entrypoint reads the key inside the runtime, after container start.
services:
  agent:
    environment:
      MODEL_NAME: anthropic/claude-haiku-5-5
      ANTHROPIC_API_KEY_SSM_PARAMETER: /example/anthropic-api-key
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    # 鍵の値が履歴に入っていないかを全履歴で確かめる（#289）。ルールは .gitleaks.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Self-test (the Langfuse rule detects a dummy key)
        run: |
          # 鍵の形をファイルに書かないよう、実行時に組み立てる
          if printf 'K=%s-lf-%s\n' sk 0f3a9c2e-7b41-4d8a-9e6f-1c2b3d4e5f60 \
            | docker run --rm -i -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 stdin --no-banner --redact; then
            echo "::error::.gitleaks.toml の langfuse-key ルールがダミーの鍵を検出しなかった"; exit 1
          fi
      - name: Scan full history
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact --log-opts=--all

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [agent, cli, mcp-server, bff, maintenance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.component }}/uv.lock"
      # 手順は run: だけで完結させる（Private 側の PR は local-ci.ts が run: だけを根で、env なしに回す。
      # そこでは COMPONENT が空なので全コンポーネントを順に回す）
      - name: Run unit tests
        env:
          COMPONENT: ${{ matrix.component }}
        run: for c in ${COMPONENT:-agent cli mcp-server bff maintenance}; do (cd "$c" && uv sync && uv run pytest -q) || exit 1; done
      - name: Run scripts tests
        if: matrix.component == 'maintenance'  # 保守とセキュリティの道具（scripts/setup・scripts/security）
        run: uv run --no-project --with pytest pytest scripts -q

  license:
    # 依存のライセンスを方針と照らす（PBI #344。docs/maintenance/license-policy.md）。一覧は成果物に残す
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [agent, cli, mcp-server, bff, maintenance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            ${{ matrix.component }}/uv.lock
            maintenance/uv.lock
      - name: Check dependency licenses
        env:
          COMPONENT: ${{ matrix.component }}
        run: for c in ${COMPONENT:-agent cli mcp-server bff maintenance}; do ./scripts/license_check.sh "$c" || exit 1; done
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report-${{ matrix.component }}
          path: license-report/

  integration:
    runs-on: ubuntu-latest
    needs: unit
    # third-party code (a2a-tck) runs in this job: a read-only token
    permissions:
      contents: read
    env:
      # a2a-tck (A2A conformance) is pinned; how to move it: docs/architecture/a2a.md §8
      A2A_TCK_REF: 263b9cfaf16a554bdfb166a7ba5b67716e946349
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Create .env for compose (a fresh DB password; no API keys)
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" > .env
      # 統合と a2a-tck は Actions（公開側の同期の PR）でだけ回す。local-ci.ts は開発ホストで回り、
      # そこでは compose のスタックを上げも下ろしもしない（GITHUB_ACTIONS が無ければ飛ばす）
      # 統合の構成は docker-compose.yml・docker-compose.test.yml・compose/test/*.yml（docs/test_matrix.md）
      - name: Set COMPOSE_FILE for the integration stack
        run: |
          [ -n "${GITHUB_ACTIONS:-}" ] || { echo "skip: Actions の外"; exit 0; }
          echo "COMPOSE_FILE=$(./scripts/compose_files.sh test)" >> "$GITHUB_ENV"
      - name: Build and start the stack (fake LLM, no API keys)
        run: |
          [ -n "${GITHUB_ACTIONS:-}" ] || { echo "skip: Actions の外"; exit 0; }
          docker compose build
          docker compose up -d --wait
      - name: Run integration tests
        run: |
          [ -n "${GITHUB_ACTIONS:-}" ] || { echo "skip: Actions の外"; exit 0; }
          cd tests/integration
          uv sync
          uv run pytest -q
      - name: A2A conformance (a2a-tck, MUST, JSON-RPC)
        # The deselected tests cannot pass on DAK (docs/architecture/a2a.md §8)
        run: |
          [ -n "${GITHUB_ACTIONS:-}" ] || { echo "skip: Actions の外"; exit 0; }
          git clone -q https://github.com/a2aproject/a2a-tck.git "$RUNNER_TEMP/a2a-tck"
          git -C "$RUNNER_TEMP/a2a-tck" checkout -q "$A2A_TCK_REF"
          cd "$RUNNER_TEMP/a2a-tck"
          uv sync --locked
          uv run --locked ./run_tck.py --sut-host http://localhost:8000/a2a/dak_agent --transport jsonrpc --level must -- \
            --deselect "tests/compatibility/core_operations/test_artifacts.py::TestTextArtifact::test_task_has_text_artifact[jsonrpc]" \
            --deselect "tests/compatibility/core_operations/test_artifacts.py::TestFileArtifact::test_task_has_file_artifact[jsonrpc]" \
            --deselect "tests/compatibility/core_operations/test_artifacts.py::TestFileUrlArtifact::test_task_has_file_url_artifact[jsonrpc]" \
            --deselect "tests/compatibility/core_operations/test_artifacts.py::TestDataArtifact::test_task_has_data_artifact[jsonrpc]" \
            --deselect "tests/compatibility/core_operations/test_artifacts.py::TestMessageResponse::test_returns_message_with_text_part[jsonrpc]" \
            --deselect "tests/compatibility/core_operations/test_data_model.py::TestCamelCaseFieldNames::test_no_snake_case_keys"
      - name: Upload a2a-tck report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a2a-tck-report
          path: ${{ runner.temp }}/a2a-tck/reports/
          if-no-files-found: ignore
      - name: Dump service logs on failure
        if: failure()
        run: |
          [ -n "${GITHUB_ACTIONS:-}" ] || { echo "skip: Actions の外"; exit 0; }
          docker compose logs --no-color > compose-logs.txt
      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        run: |
          [ -n "${GITHUB_ACTIONS:-}" ] || { echo "skip: Actions の外"; exit 0; }
          docker compose down -v
